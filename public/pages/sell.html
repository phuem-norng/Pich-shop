        <!-- POS SELL PAGE -->
        <div id="page-sell" class="page">
            <h1>Point of Sale</h1>
            <div class="search-container">
                <input type="text" id="sell-search" class="search-bar" placeholder="Search boutique collection..." oninput="renderSellPage()">
            </div>
            <div class="sell-container">
                <div class="products-grid" id="sell-products-grid"></div>
                <div class="cart-panel">
                    <h3>Checkout Session</h3>
                    <div class="form-group">
                        <label>Custom Sale ID (Optional)</label>
                        <input type="text" id="custom-sale-id" placeholder="e.g. sale101">
                    </div>
                    <div class="form-group" style="margin-top: 10px;">
                        <label>Assign Customer</label>
                        <select id="customerId-cart"></select>
                    </div>
                    <div class="form-group" style="margin-top: 10px; margin-bottom: 10px;">
                        <label>Payment Method</label>
                        <select id="paymentMethod-cart">
                            <option value="Cash">Cash</option>
                            <option value="ABA">ABA Transfer</option>
                            <option value="Card">Card</option>
                        </select>
                    </div>
                    <div class="cart-items" id="cart-items-container"></div>
                    <div class="cart-total">
                        <span>Total:</span>
                        <span id="cart-total-amount">$0.00</span>
                    </div>
                    <button class="btn-checkout" onclick="checkout()">Finalize Sale</button>
                </div>
            </div>
        </div>
