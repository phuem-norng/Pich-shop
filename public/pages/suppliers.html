        <!-- SUPPLIERS DIRECTORY -->
        <div id="page-suppliers" class="page">
            <div class="page-toolbar">
                <h1>Goldsmiths & Wholesalers</h1>
                <button type="button" class="btn-add-entity" onclick="showSupplierForm()">
                    <span class="plus">+</span> Add Supplier
                </button>
            </div>
            <div class="search-container">
                <input type="text" id="supplier-search" class="search-bar" placeholder="Search by company, city, phone, or email..." oninput="listPages.suppliers=1; renderSuppliersPage()">
            </div>

            <div class="inventory-card">
                <div class="inventory-card-header">
                    <h3>Supplier Directory</h3>
                    <span class="inv-count" id="supplier-item-count">0 suppliers</span>
                </div>
                <div class="inventory-table-wrap">
                    <table class="inventory-table">
                        <thead>
                            <tr>
                                <th>Supplier</th>
                                <th>City</th>
                                <th>Phone</th>
                                <th>Email</th>
                                <th>Address</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="supplier-table-rows"></tbody>
                    </table>
                </div>
                <div class="pagination" id="supplier-pagination"></div>
            </div>
        </div>

<!-- Supplier Form Modal -->
        <div class="modal-overlay" id="supplier-form-modal" onclick="if(event.target===this) hideSupplierForm()">
            <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="supplier-form-title">
                <div class="modal-dialog-header">
                    <h2 id="supplier-form-title">Add New Supplier</h2>
                    <button type="button" class="modal-close" onclick="hideSupplierForm()" aria-label="Close">&times;</button>
                </div>
                <div class="form-inline">
                    <input type="hidden" id="original-supplier-id">
                    <div class="form-group">
                        <label>Supplier ID</label>
                        <input type="text" id="supplierId-form" placeholder="e.g. supplier101">
                    </div>
                    <div class="form-group">
                        <label>Company Name</label>
                        <input type="text" id="companyName" placeholder="Precious Metals Co.">
                    </div>
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="text" id="phoneNumber-supplier" placeholder="Phone">
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="email-supplier" placeholder="Email">
                    </div>
                    <div class="form-group">
                        <label>Address</label>
                        <input type="text" id="address" placeholder="Address">
                    </div>
                    <div class="form-group">
                        <label>City</label>
                        <input type="text" id="city" placeholder="City">
                    </div>
                    <button class="btn btn-add" id="btn-save-supplier" onclick="saveSupplier()">Save Supplier</button>
                    <button class="btn" id="btn-cancel-supplier-edit" onclick="cancelSupplierEdit()" style="background:#f1f5f9; color: var(--text-dark);">Cancel</button>
                </div>
            </div>
        </div>
