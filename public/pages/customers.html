        <!-- CUSTOMERS DIRECTORY -->
        <div id="page-customers" class="page">
            <div class="page-toolbar">
                <h1>Clientele Book</h1>
                <button type="button" class="btn-add-entity" onclick="showCustomerForm()">
                    <span class="plus">+</span> Add Customer
                </button>
            </div>
            <div class="search-container">
                <input type="text" id="customer-search" class="search-bar" placeholder="Search by name, phone, email, or ID..." oninput="listPages.customers=1; renderCustomersPage()">
            </div>

            <div class="inventory-card">
                <div class="inventory-card-header">
                    <h3>Customer Profiles</h3>
                    <span class="inv-count" id="customer-item-count">0 profiles</span>
                </div>
                <div class="inventory-table-wrap">
                    <table class="inventory-table">
                        <thead>
                            <tr>
                                <th>Customer</th>
                                <th>Location</th>
                                <th>Phone</th>
                                <th>Email</th>
                                <th>Loyalty</th>
                                <th>Total Spent</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="customer-table-rows"></tbody>
                    </table>
                </div>
                <div class="pagination" id="customer-pagination"></div>
            </div>
        </div>

<!-- Customer Form Modal -->
        <div class="modal-overlay" id="customer-form-modal" onclick="if(event.target===this) hideCustomerForm()">
            <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="customer-form-title">
                <div class="modal-dialog-header">
                    <h2 id="customer-form-title">Add New Customer</h2>
                    <button type="button" class="modal-close" onclick="hideCustomerForm()" aria-label="Close">&times;</button>
                </div>
                <div class="form-inline">
                    <input type="hidden" id="original-customer-id">
                    <div class="form-group">
                        <label>Customer ID</label>
                        <input type="text" id="customerId" placeholder="e.g. customer101">
                    </div>
                    <div class="form-group">
                        <label>Boutique / First Name</label>
                        <input type="text" id="firstName" placeholder="First Name">
                    </div>
                    <div class="form-group">
                        <label>Location / Notes</label>
                        <input type="text" id="lastName" placeholder="Sangkat details">
                    </div>
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="text" id="phoneNumber" placeholder="Phone">
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="email" placeholder="Email">
                    </div>
                    <div class="form-group">
                        <label>Loyalty Tiers</label>
                        <select id="loyaltyStatus">
                            <option value="Standard">Standard Tier</option>
                            <option value="Tier 1">Tier 1 Elite</option>
                            <option value="Tier 2">Tier 2 VIP</option>
                        </select>
                    </div>
                    <button class="btn btn-add" id="btn-save-customer" onclick="saveCustomer()">Save Profile</button>
                    <button class="btn" id="btn-cancel-customer-edit" onclick="cancelCustomerEdit()" style="background:#f1f5f9; color: var(--text-dark);">Cancel</button>
                </div>
            </div>
        </div>
