<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxury Jewelry POS</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

    <nav>
        <div class="logo-container">
            <img src="assets/images/logo.png" alt="Boutique Logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
            <span class="logo-placeholder" style="display: none;">dia Jewelry POS</span>
        </div>
        <button onclick="switchPage('dashboard')" id="nav-dashboard" class="active">Dashboard</button>
        <button onclick="switchPage('sell')" id="nav-sell">Sell Page (POS)</button>
        <button onclick="switchPage('order-history')" id="nav-order-history">Order History</button>
        <button onclick="switchPage('stock')" id="nav-stock">Stock</button>
        <button onclick="switchPage('customers')" id="nav-customers">Customers</button>
        <button onclick="switchPage('suppliers')" id="nav-suppliers">Suppliers</button>
        <button onclick="switchPage('staff')" id="nav-staff">Staff</button>
    </nav>

    <!-- Main Workspace -->
    <main>
        <div class="header-bar">
            <div class="header-page-title" id="header-page-title">Dashboard</div>
            <div class="user-profile">
                <div class="user-avatar" id="current-user-avatar">?</div>
                <div class="form-group" style="flex-direction: row; align-items: center; gap: 8px;">
                    <label style="white-space: nowrap;">Active Staff:</label>
                    <select id="employeeId-active" onchange="updateActiveStaffProfile()"></select>
                </div>
            </div>
        </div>

        <div id="page-root">
            <!-- Pages loaded from /pages/*.html -->
        </div>
    </main>

    <script src="assets/js/data.js"></script>
    <script src="assets/js/common.js"></script>
    <script src="assets/js/dashboard.js"></script>
    <script src="assets/js/order-history.js"></script>
    <script src="assets/js/sell.js"></script>
    <script src="assets/js/stock.js"></script>
    <script src="assets/js/customers.js"></script>
    <script src="assets/js/suppliers.js"></script>
    <script src="assets/js/staff.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
